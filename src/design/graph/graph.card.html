<link rel="stylesheet" href="../../styles.css">
<div id="root" style="background:#353535;padding:20px"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Knot, Thread, ClusterFilter, QueryBar } = window.SkeinDesignSystem_8e5175;
function Demo(){
  const [sel,setSel]=React.useState(["db","auth"]);
  const clusters=[{id:"db",name:"database choice",color:"#DECD87",count:3},{id:"auth",name:"auth strategy",color:"#B2945B",count:2},{id:"deploy",name:"deploy target",color:"#56626C",count:4}];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:"18px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
        <Knot label="postgres" status="active" size={70}/>
        <Thread status="active" width={140}/>
        <Knot label="mongodb" status="superseded" size={44}/>
        <Thread status="superseded" width={140}/>
        <Knot label="postgres (again)" status="correction" size={58}/>
      </div>
      <div style={{display:"flex",gap:"20px"}}>
        <div style={{width:220}}><ClusterFilter clusters={clusters} selected={sel} onToggle={(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id])}/></div>
        <div style={{flex:1}}><QueryBar value='why postgres?' onChange={()=>{}} result="3 hops · chain · current: Postgres"/></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
